<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Eukaryotic Eucharist</title>
<style>
:root{
  --dermis:#3a181c; --bed:#6b2c34; --fiber:#c47a72; --ink:#f6ebe4;
  --muted:#c9a8a0; --heat:#ff7a4a; --gold:#f0d08a; --good:#9ee0b8;
  --bad:#ff6b7d; --panel:rgba(28,10,14,.78); --line:rgba(240,208,138,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a090c;color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#wrap{position:relative;width:100vw;height:100vh;background:
  radial-gradient(ellipse at 20% 40%,#5a2430 0%,#2a1014 55%,#14080a 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.word{position:absolute;left:14px;top:12px;letter-spacing:.14em;text-transform:uppercase;
  font-size:11px;font-weight:800;color:var(--gold);opacity:.85}
.vitals{position:absolute;left:14px;top:36px;width:min(320px,46vw);display:grid;gap:7px}
.vital{pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:7px 10px}
.vital b{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.bar{height:8px;margin-top:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px}
.dock{position:absolute;left:12px;right:12px;bottom:12px;pointer-events:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 12px 12px}
.dock h2{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.organs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(min-width:720px){.organs{grid-template-columns:repeat(5,1fr)}}
.act{appearance:none;border:1px solid rgba(255,255,255,.14);border-radius:12px;
  background:rgba(255,255,255,.04);color:var(--ink);padding:10px 8px;font-weight:800;
  font-size:11px;cursor:pointer;min-height:52px}
.act small{display:block;font-weight:650;color:var(--muted);font-size:9px;margin-top:2px}
.act.on{border-color:rgba(158,224,184,.55);background:rgba(158,224,184,.12)}
.act.lock{opacity:.28;cursor:not-allowed;filter:saturate(.4)}
.act.live{transform:scale(.97);background:rgba(240,208,138,.18)}
.note{position:absolute;left:50%;top:18px;transform:translateX(-50%);max-width:70vw;
  text-align:center;font-size:13px;font-weight:800;color:var(--gold);text-shadow:0 2px 10px #000;
  pointer-events:none}
.gate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(12,4,6,.82);z-index:20;pointer-events:auto}
.gate .box{width:min(420px,86vw);background:var(--panel);border:1px solid var(--line);
  border-radius:22px;padding:26px 22px;text-align:center}
.gate h1{margin:0 0 8px;font-size:22px}
.gate p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.4}
.gate button{border:0;border-radius:999px;background:var(--gold);color:#2a120c;
  font-weight:900;padding:11px 18px;cursor:pointer}
.seed{position:absolute;right:14px;top:12px;font-size:11px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bed"></canvas>
  <div class="hud">
    <div class="word">Eukaryotic Eucharist</div>
    <div class="seed" id="seed">seed 11</div>
    <div class="vitals">
      <div class="vital"><b><span>Integrity</span><span id="iv">1.00</span></b><div class="bar"><i id="ib" style="background:#9ee0b8"></i></div></div>
      <div class="vital"><b><span>Inflammation</span><span id="hv">0.00</span></b><div class="bar"><i id="hb" style="background:#ff7a4a"></i></div></div>
      <div class="vital"><b><span>Bacteria</span><span id="bv">0.00</span></b><div class="bar"><i id="bb" style="background:#d6e07a"></i></div></div>
      <div class="vital"><b><span>Eukaryotes</span><span id="ev">0.00</span></b><div class="bar"><i id="eb" style="background:#c48ad6"></i></div></div>
    </div>
    <div class="note" id="note">You are the host immune system. Detect. Deploy. Clear. Remember.</div>
    <div class="dock">
      <h2>Lymph dock — organs only. Empty click is lymph rhythm.</h2>
      <div class="organs" id="organs"></div>
    </div>
  </div>
  <div class="gate" id="gate"><div class="box">
    <h1 id="gtitle">Incursion</h1>
    <p id="gbody">A breach opens in the tissue bed.</p>
    <button id="ggo" type="button">Begin</button>
  </div></div>
</div>
<script>
const ORGANS = [
  "phagosome","rasping_lamella","toxin_cloud","crystal_ward",
  "lipid_repair_loom","pheromone_gland","lance_bristle","cleavage_furrow",
  "organ_manufacturing"
];
const LABELS = {
  phagosome:["Phagosome","engulf"],
  rasping_lamella:["Rasping lamella","shred"],
  toxin_cloud:["Toxin cloud","inflammation"],
  crystal_ward:["Crystal ward","granuloma"],
  lipid_repair_loom:["Repair loom","stitch"],
  pheromone_gland:["Pheromone","detect"],
  lance_bristle:["Lance","cytotoxic"],
  cleavage_furrow:["Cleavage","clone"],
  organ_manufacturing:["Manufacture","graft"]
};
const PARAM = {
  wave_budget:18, bacteria_growth:0.12, eukaryote_growth:0.04,
  toxin_potency:0.35, toxin_inflammation:0.22, phagosome_rate:0.18,
  repair_rate:0.08, memory_retain:0.35, storm_inflammation:0.82
};
function clip(v, lo, hi){ lo = lo ?? 0; hi = hi ?? 1; return v < lo ? lo : v > hi ? hi : v; }
function worldOf(seed){
  return {
    seed, t:0, integrity:1, inflammation:0, bacteria:0, eukaryote:0, memory:0,
    wave_index:0, incoming:PARAM.wave_budget, storm:false, collapsed:false, clears:0,
    events:[],
    organs:{phagosome:1, rasping_lamella:1, toxin_cloud:1, lipid_repair_loom:1,
            crystal_ward:0, pheromone_gland:0, lance_bristle:0, cleavage_furrow:0,
            organ_manufacturing:1}
  };
}
function hasOrg(w, name){ return ORGANS.includes(name) && (w.organs[name]||0) > 0; }
function apply(w, command){
  if (w.collapsed || w.storm) return false;
  if (!ORGANS.includes(command) || !hasOrg(w, command)) return false;
  const p = PARAM;
  if (command === "toxin_cloud"){
    const dmg = p.toxin_potency * (0.7 + 0.3 * w.memory);
    w.bacteria = clip(w.bacteria - dmg);
    w.eukaryote = clip(w.eukaryote - dmg * 0.45);
    w.inflammation = clip(w.inflammation + p.toxin_inflammation);
    w.events.push({type:"toxin", t:w.t}); return true;
  }
  if (command === "phagosome"){
    w.bacteria = clip(w.bacteria - p.phagosome_rate * (1 + w.memory));
    w.events.push({type:"phagosome", t:w.t}); return true;
  }
  if (command === "rasping_lamella"){
    w.bacteria = clip(w.bacteria - p.phagosome_rate * 0.6);
    w.eukaryote = clip(w.eukaryote - p.phagosome_rate * 0.8); return true;
  }
  if (command === "lipid_repair_loom"){
    w.integrity = clip(w.integrity + p.repair_rate);
    w.inflammation = clip(w.inflammation - 0.04); return true;
  }
  if (command === "crystal_ward"){ w.incoming = Math.max(0, w.incoming - 2); return true; }
  if (command === "lance_bristle"){ w.eukaryote = clip(w.eukaryote - 0.22); return true; }
  if (command === "pheromone_gland"){
    w.incoming = Math.max(0, w.incoming - 1.5);
    w.events.push({type:"detect", t:w.t}); return true;
  }
  if (command === "cleavage_furrow"){
    w.organs.phagosome = Math.min(3, (w.organs.phagosome||0) + 1);
    w.events.push({type:"clone", t:w.t}); return true;
  }
  if (command === "organ_manufacturing"){
    for (const name of ["crystal_ward","lance_bristle","pheromone_gland","cleavage_furrow"]){
      if ((w.organs[name]||0) <= 0){ w.organs[name] = 1; w.events.push({type:"graft", t:w.t, organ:name}); return true; }
    }
    return false;
  }
  return false;
}
function step(w, dt, commands){
  if (w.collapsed || w.storm){ w.t += dt; return w; }
  const p = PARAM;
  if (w.incoming > 0){
    const leak = Math.min(w.incoming, 1.4 * dt);
    w.incoming -= leak;
    w.bacteria = clip(w.bacteria + leak / p.wave_budget);
    if (w.wave_index === 0){ w.events.push({type:"breach", t:w.t}); w.wave_index = 1; }
  }
  w.bacteria = clip(w.bacteria + p.bacteria_growth * w.bacteria * dt * 0.15);
  w.eukaryote = clip(w.eukaryote + p.eukaryote_growth * dt * (0.02 + 0.04 * w.bacteria));
  const pressure = w.bacteria * 0.12 + w.eukaryote * 0.22;
  w.integrity = clip(w.integrity - pressure * dt);
  w.inflammation = clip(w.inflammation * (1 - 0.08 * dt));
  for (const c of commands) apply(w, c);
  if (w.inflammation >= p.storm_inflammation && w.integrity < 0.55){
    w.storm = true; w.events.push({type:"storm", t:w.t});
  }
  if (w.integrity <= 0){ w.collapsed = true; w.events.push({type:"collapse", t:w.t}); }
  if (w.incoming <= 1e-6 && w.bacteria <= 0.04 && w.eukaryote <= 0.04 && !w.collapsed && !w.storm){
    if (w.wave_index > 0 && w.clears === 0){
      w.clears = 1; w.memory = clip(w.memory + p.memory_retain);
      w.events.push({type:"clear", t:w.t});
    }
  }
  w.t += dt; return w;
}

const canvas = document.getElementById("bed");
const ctx = canvas.getContext("2d");
let W, H, world, queued = [], last = 0, running = false, particles = [];
function resize(){
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", resize); resize();

function spawn(){
  const nB = 8 + Math.floor(world.bacteria * 28);
  const nE = 2 + Math.floor(world.eukaryote * 10);
  while (particles.filter(p => p.k === "b").length < nB){
    particles.push({k:"b", x: 0.08*W + Math.random()*0.2*W, y: Math.random()*H, s: 3+Math.random()*3, a: Math.random()*6});
  }
  while (particles.filter(p => p.k === "e").length < nE){
    particles.push({k:"e", x: 0.1*W + Math.random()*0.25*W, y: Math.random()*H, s: 10+Math.random()*8, a: Math.random()*6});
  }
  particles = particles.filter(p => (p.k==="b"?particles.filter(q=>q.k==="b").indexOf(p)<nB:particles.filter(q=>q.k==="e").indexOf(p)<nE));
}
function draw(){
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0, "#4a1c24"); g.addColorStop(0.5, "#2c1216"); g.addColorStop(1, "#14080a");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 0.18 + world.integrity * 0.35;
  ctx.strokeStyle = "#c47a72"; ctx.lineWidth = 1.2;
  for (let i=0;i<18;i++){
    ctx.beginPath();
    ctx.moveTo(0, (i/18)*H);
    ctx.bezierCurveTo(W*0.3, (i/18)*H + Math.sin(world.t*0.04+i)*30, W*0.7, (i/18)*H, W, (i/18)*H + 20);
    ctx.stroke();
  }
  ctx.globalAlpha = world.inflammation * 0.45;
  ctx.fillStyle = "#ff7a4a"; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = "#6b1820";
  ctx.beginPath(); ctx.ellipse(0, H*0.5, 0.08*W + world.incoming, H*0.22, 0, 0, Math.PI*2); ctx.fill();
  for (const p of particles){
    p.x += Math.cos(p.a) * (p.k==="b"?1.4:0.7);
    p.y += Math.sin(p.a*0.7) * 0.8;
    p.a += 0.02;
    if (p.x > W*0.92) p.x = 0.08*W;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    if (p.k==="b"){ ctx.fillStyle = "#d6e07a"; ctx.beginPath(); ctx.ellipse(p.x,p.y,p.s*1.6,p.s*0.6,p.a,0,Math.PI*2); ctx.fill(); }
    else { ctx.fillStyle = "#c48ad6"; ctx.beginPath(); ctx.ellipse(p.x,p.y,p.s,p.s*0.7,p.a*0.3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#f6ebe4"; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*0.28,0,Math.PI*2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function setBar(id, v){ document.getElementById(id).style.width = (clip(v)*100).toFixed(1)+"%"; }
function hud(){
  document.getElementById("iv").textContent = world.integrity.toFixed(2);
  document.getElementById("hv").textContent = world.inflammation.toFixed(2);
  document.getElementById("bv").textContent = world.bacteria.toFixed(2);
  document.getElementById("ev").textContent = world.eukaryote.toFixed(2);
  setBar("ib", world.integrity); setBar("hb", world.inflammation);
  setBar("bb", world.bacteria); setBar("eb", world.eukaryote);
  const note = document.getElementById("note");
  if (world.storm) note.textContent = "Cytokine storm. The host dies of the cure.";
  else if (world.collapsed) note.textContent = "Tissue collapse. The incursion holds the bed.";
  else if (world.clears && world._wave2) note.textContent = "Second strain cleared. Memory kept. Rest is a lymph beat.";
  else if (world._wave2) note.textContent = "Second incursion. Memory is a prior. Over-response is still a real loss.";
  else if (world.clears) note.textContent = "Cleared. Memory kept. Rest is a lymph beat, not a column.";
  else if (world.wave_index) note.textContent = "Wave in tissue. Over-response is a real loss.";
  const box = document.getElementById("organs");
  if (!box.dataset.ready){
    box.innerHTML = ORGANS.map(name => {
      const [t,s] = LABELS[name];
      return `<button class="act lock" data-organ="${name}" type="button">${t}<small>${s}</small></button>`;
    }).join("");
    box.dataset.ready = "1";
    box.addEventListener("click", e => {
      const btn = e.target.closest("[data-organ]");
      if (!btn || btn.classList.contains("lock") || !running) return;
      queued.push(btn.dataset.organ);
      btn.classList.add("live");
      setTimeout(() => btn.classList.remove("live"), 120);
    });
  }
  for (const btn of box.querySelectorAll("[data-organ]")){
    const on = hasOrg(world, btn.dataset.organ);
    btn.classList.toggle("lock", !on);
    btn.classList.toggle("on", on);
  }
}
function end(title, body){
  running = false;
  document.getElementById("gtitle").textContent = title;
  document.getElementById("gbody").textContent = body;
  document.getElementById("ggo").textContent = "Again";
  document.getElementById("gate").style.display = "flex";
}
function policy(w){
  if (w.inflammation > 0.55) return ["lipid_repair_loom"];
  if (w.eukaryote > 0.12) return ["rasping_lamella"];
  if (w.bacteria > 0.08) return w.inflammation < 0.5 ? ["phagosome","toxin_cloud"] : ["phagosome"];
  if (w.integrity < 0.85) return ["lipid_repair_loom"];
  return [];
}
function tick(ts){
  if (!running) return;
  if (!last) last = ts;
  const dt = Math.min(0.08, (ts - last) / 1000) * 8;
  last = ts;
  let cmds = queued.splice(0, queued.length);
  if (!cmds.length) cmds = policy(world);
  step(world, dt, cmds);
  if (world.clears === 1 && !world._wave2){
    world._wave2 = true;
    world.clears = 0;
    world.incoming = PARAM.wave_budget;
    world.wave_index = 2;
    world.bacteria = 0.04;
    world.eukaryote = 0.02;
  }
  spawn(); draw(); hud();
  if (world.storm) return end("Storm", "Inflammation ate the host. Beauty must not eat goodness.");
  if (world.collapsed) return end("Collapse", "The tissue bed hit zero. The incursion won.");
  if (world.clears && world._wave2) return end("Clear", "Two strains remembered. Next incursion will not be identical.");
  requestAnimationFrame(tick);
}
function start(){
  world = worldOf(11);
  particles = []; queued = []; last = 0; running = true;
  document.getElementById("gate").style.display = "none";
  document.getElementById("seed").textContent = "seed " + world.seed;
  spawn(); hud();
  requestAnimationFrame(tick);
}
document.getElementById("ggo").addEventListener("click", start);
document.getElementById("gate").style.display = "flex";
</script>
</body>
</html>
